<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>正在打开转转…</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f7f8fa; color: #1a1a1a;
  }
  .box { text-align: center; padding: 32px 24px; max-width: 320px; }
  .logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, #ff8a00, #ff5000);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 36px;
  }
  h1 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
  p { font-size: 14px; color: #888; margin: 0 0 24px; line-height: 1.6; }
  .btn {
    display: block; padding: 14px 24px; border-radius: 26px;
    background: linear-gradient(135deg, #ff8a00, #ff5000);
    color: #fff; text-decoration: none; font-size: 16px;
    font-weight: 600; box-shadow: 0 6px 16px rgba(255,90,0,.3);
  }
  .btn:active { transform: scale(.97); }
  .alt {
    display: block; margin-top: 14px; font-size: 13px;
    color: #999; text-decoration: none;
  }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid #ff8a00; border-top-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -3px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🔄</div>
  <h1><span class="spinner"></span>正在打开转转…</h1>
  <p id="tip">如果没自动跳转，点下面按钮</p>
  <a class="btn" id="btn" href="#">打开转转 APP</a>
  <a class="alt" id="h5" href="#">或在浏览器中查看</a>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var infoId = q.get('infoId') || '';
  var metric = q.get('metric') || '';
  var path   = q.get('path')   || 'core/infoDetail/jump';

  var scheme = 'zhuanzhuan://jump/' + path +
               '?infoId=' + encodeURIComponent(infoId) +
               (metric ? '&metric=' + encodeURIComponent(metric) : '');

  var h5 = 'https://m.zhuanzhuan.com/u/streamline_detail/new-goods-detail' +
           '?init_from=2_1_18928_0&infoId=' + encodeURIComponent(infoId) +
           (metric ? '&metric=' + encodeURIComponent(metric) : '');

  document.getElementById('btn').href = scheme;
  document.getElementById('h5').href  = h5;

  var start = Date.now();
  var hidden = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) hidden = true;   // 页面被切走 = APP 起来了
  });

  // 尝试唤起 APP
  try { location.href = scheme; } catch (e) {}

  setTimeout(function () {
    if (hidden) return;                   // 已经跳走了
    document.getElementById('tip').textContent =
      '没检测到转转 APP，2 秒后打开网页版';
    setTimeout(function () {
      if (!document.hidden) location.href = h5;
    }, 2000);
  }, 1200);
})();
</script>
</body>
</html>
